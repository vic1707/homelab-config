## General config
BOFZILLA_PASSWORD: admin
SSH_PORT: 22 # hardcoded in manage.sh
TZ: /usr/share/zoneinfo/Europe/Paris
PODMAN_TUNNEL_SUBNET: 10.89.0.0/26
CADDY:
  IP: 10.89.0.60

## Domain configuration
DOMAIN:
  URL: telstar.localhost
  EXPOSED: false
  # CLOUDFLARE_API_TOKEN

## Backup strategy
BACKUP: false

## Service account Email
SMTP: false

## Crowdsec conf
CROWDSEC:
  ENROLL_KEY: ""
  INSTANCE_NAME: telstar-dev
  CADDY_BOUNCER_API_KEY: {{ random.AlphaNum 80 }}
  FIREWALL_BOUNCER_API_KEY: {{ random.AlphaNum 80 }}

## Auth
LLDAP:
  SUBDOMAIN: lldap
  ADMIN_USER: admin
  ADMIN_PASS: adminadmin
  KEY_SEED: {{ random.AlphaNum 120 }}
  JWT_SECRET: {{ random.AlphaNum 120 }}

AUTHELIA:
  SUBDOMAIN: auth
  LLDAP_PASSWORD: {{ random.AlphaNum 120 }}
  STORAGE_ENCRYPTION_KEY: {{ random.AlphaNum 120 }}
  JWT_SECRET: {{ random.AlphaNum 120 }}
  JWT_SECRET_PWD_RESET: {{ random.AlphaNum 120 }}

GATUS:
  SUBDOMAIN: uptime

HEADSCALE:
  SUBDOMAIN: headscale