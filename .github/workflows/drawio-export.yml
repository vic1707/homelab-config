name: Draw.io-export

on:
  push:
    branches: [moving-out] # TODO: rename to main once we're done with big refacto
    paths:
      - "**.drawio"
      - .github/workflows/drawio-export.yml
  workflow_dispatch:

permissions: {}

jobs:
  drawio-export:
    permissions:
      contents: write # <https://github.com/peaceiris/actions-gh-pages?tab=readme-ov-file#%EF%B8%8F-first-deployment-with-github_token>
    name: Export draw.io diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Needed by rlespinasse/drawio-export-action

      - name: Use Draw.io CLI to export diagram
        uses: rlespinasse/drawio-export-action@08cb4d9f5e4ccea004176e41dc1368672f5a458c # v2.51.0
        with:
          format: svg
          remove-page-suffix: true

      - name: centralize exports
        run: |
          sudo mkdir exports
          sudo mv ./**/export/*.svg exports/

      - name: Push exported diagram to `diagrams` branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports
          publish_branch: diagrams
          force_orphan: true
