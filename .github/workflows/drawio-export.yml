name: Draw.io-export

on:
  push:
    branches: [moving-out] # TODO: rename to main once we're done with big refacto
    paths:
      - "**.drawio"
      - .github/workflows/drawio-export.yml
  workflow_dispatch:

permissions: {}

jobs:
  drawio-export:
    permissions:
      contents: write # <https://github.com/peaceiris/actions-gh-pages?tab=readme-ov-file#%EF%B8%8F-first-deployment-with-github_token>
    name: Export draw.io diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0 # Needed by rlespinasse/drawio-export-action

      - name: Use Draw.io CLI to export diagram
        uses: rlespinasse/drawio-export-action@ab18c9d2586ebc8699ac8565228daa01937017b7 # v2.42.0
        with:
          format: svg
          remove-page-suffix: true

      - name: centralize exports
        run: |
          sudo mkdir exports
          sudo mv ./**/export/*.svg exports/

      - name: Push exported diagram to `diagrams` branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./exports
          publish_branch: diagrams
          force_orphan: true
