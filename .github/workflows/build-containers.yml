name: Build & Push Custom Container Images

on:
  push:
    branches: [moving-out] # TODO: rename to main once we're done with big refacto
    paths:
      - '**/*.containerfile'
  workflow_dispatch:
    inputs:
      containerfile:
          description: The container to build
          type: string
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '**/*.containerfile'

permissions: {}

env:
  SHA: ${{ github.sha }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  detect-changes:
    name: Detect changed containerfiles
    runs-on: ubuntu-latest
    outputs:
      containerfiles: ${{ steps.set-containerfiles.outputs.containerfiles }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Get changed containerfiles paths
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: changed-containerfiles
        uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62 # v47.0.0
        with:
          files: '**/*.containerfile'
          matrix: true
      
      - name: Workflow Dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: manual-containerfile
        env: 
          CONTAINER_FILE: ${{ inputs.containerfile }}
        run: |
          if [ ! -f "$CONTAINER_FILE" ]; then
            echo "Containerfile '$CONTAINER_FILE' not found!"
            exit 1
          fi
          echo "containerfiles=[\"$CONTAINER_FILE\"]" >> "$GITHUB_OUTPUT"

      - name: Set containerfiles
        id: set-containerfiles
        env:
          CHANGED_FILES: ${{ steps.changed-containerfiles.outputs.all_changed_files }}
          MANUAL: ${{ steps.manual-containerfile.outputs.containerfiles }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "containerfiles=$MANUAL" >> "$GITHUB_OUTPUT"
          else
            echo "containerfiles=$CHANGED_FILES" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Push custom containers
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.detect-changes.outputs.containerfiles) }}
      max-parallel: 4
      fail-fast: false
    permissions:
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install QEMU
        run: |
          sudo apt update
          sudo apt install -y qemu-user-static

      - name: Determine tags and imagename
        id: set-env
        env:
          CONTAINER_FILE: ${{ matrix.file }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            tags="pr-${{ github.event.pull_request.number }}"
          else
            tags="latest $SHA"
          fi

          ## Set step outputs
          echo "image=$(basename "$CONTAINER_FILE" .containerfile)" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Get build dir
        id: build-dir
        env:
          CONTAINER_FILE: ${{ matrix.file }} 
        run: echo "build-dir=$(dirname "$CONTAINER_FILE")" >> "$GITHUB_OUTPUT"
      - name: Build Image
        id: build_image
        uses: redhat-actions/buildah-build@7a95fa7ee0f02d552a32753e7414641a04307056 # v2.13
        with:
          extra-args: --network=host
          image: ${{ steps.set-env.outputs.image }}
          tags: ${{ steps.set-env.outputs.tags }}
          platforms: ${{ env.PLATFORMS }}
          containerfiles: ${{ matrix.file }}
          context: ${{ steps.build-dir.outputs.build-dir }}
          # needs to be in sync with check job format
          oci: false

      - name: Push to ghcr.io
        uses: redhat-actions/push-to-registry@5ed88d269cf581ea9ef6dd6806d01562096bee9c # v2.8
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}/homelab
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
